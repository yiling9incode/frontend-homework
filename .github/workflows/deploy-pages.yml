name: Deploy frontend homework

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 下載 main 分支的程式碼
      - name: Checkout repository
        uses: actions/checkout@v7

      # 準備 Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: main-quest-05/package-lock.json

      # 安裝 main-quest-05 的套件
      - name: Install dependencies
        working-directory: main-quest-05
        run: npm ci

      # 編譯 Vite、EJS、SCSS
      - name: Build main-quest-05
        working-directory: main-quest-05
        run: npm run build

      # 建立整個 GitHub Pages 的發布內容
      - name: Prepare Pages files
        run: |
          mkdir _site

          rsync -av \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='_site/' \
            --exclude='node_modules/' \
            --exclude='main-quest-05/' \
            ./ _site/

          mkdir -p _site/main-quest-05

          cp -R main-quest-05/dist/. _site/main-quest-05/

          cp main-quest-05/dist/index.html _site/index.html

      # 設定 GitHub Pages
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      # 上傳完整網站
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4